<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!--
    Viewport rules for game shell:
    • maximum-scale=1 / user-scalable=no  → blocks pinch-zoom by browser chrome
    • viewport-fit=cover                  → content bleeds under notch/Dynamic Island
  -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0,
                 minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <!-- PWA / full-screen hints for "Add to Home Screen" -->
  <meta name="mobile-web-app-capable"            content="yes" />
  <meta name="apple-mobile-web-app-capable"      content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color"                       content="#0c0d14" />

  <title>Playing — playgriff.io</title>
  <link rel="stylesheet" href="game.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
</head>
<body class="game-body">

  <!-- Page-curtain: covers screen on enter/exit transitions -->
  <div class="page-curtain" id="page-curtain" aria-hidden="true"></div>

  <!-- ─── NAVIGATION BAR ─────────────────────────────────── -->
  <!--
    Sits above the iframe. Fixed to the top. Collapses up with a
    drag-handle so players can reclaim the full viewport mid-session.
  -->
  <nav class="gnav" id="gnav" role="navigation" aria-label="Game navigation">
    <div class="gnav__inner">

      <!-- Back to Hub -->
      <a href="index.html"
         class="gnav__back"
         id="gnav-back"
         aria-label="Back to Hub">
        <svg class="gnav__back-icon" width="20" height="20" viewBox="0 0 20 20"
             fill="none" aria-hidden="true">
          <path d="M12.5 4L7 10L12.5 16"
                stroke="currentColor" stroke-width="2.2"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="gnav__back-label">Hub</span>
      </a>

      <!-- Game title (populated by game.js) -->
      <div class="gnav__title" id="gnav-title" aria-live="polite">Loading…</div>

      <!-- Fullscreen toggle -->
      <button class="gnav__action"
              id="gnav-fullscreen"
              aria-label="Enter fullscreen"
              title="Toggle fullscreen">
        <svg width="18" height="18" viewBox="0 0 18 18"
             fill="none" aria-hidden="true" id="fs-svg">
          <path id="fs-path"
                d="M2 6V2H6M12 2H16V6M16 12V16H12M6 16H2V12"
                stroke="currentColor" stroke-width="1.8"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

    </div>

    <!--
      Drag handle: a small pill below the nav bar.
      Tapping it hides the bar to give 100% viewport to the game.
      Tapping again (or touching the top-edge of screen) restores it.
    -->
    <button class="gnav__handle"
            id="gnav-handle"
            aria-label="Hide navigation bar"
            aria-expanded="true"></button>
  </nav>

  <!-- ─── GAME STAGE ──────────────────────────────────────── -->
  <!--
    Fills all remaining space below the nav bar.
    Contains: loading screen → iframe (game) → error screen
  -->
  <div class="game-stage" id="game-stage" role="region" aria-label="Game viewport">

    <!-- Loading overlay (visible until iframe fires 'load') -->
    <div class="game-loading" id="game-loading"
         aria-live="polite" aria-atomic="true" role="status">
      <div class="loading-logo" aria-hidden="true">
        <svg width="52" height="52" viewBox="0 0 36 36" fill="none">
          <rect x="2" y="2" width="32" height="32" rx="8" fill="url(#gl-grad)"/>
          <path d="M11 18 L18 10 L25 18 L18 26 Z" fill="white" opacity="0.9"/>
          <circle cx="18" cy="18" r="3" fill="#0c0d14"/>
          <defs>
            <linearGradient id="gl-grad" x1="2" y1="2" x2="34" y2="34"
                            gradientUnits="userSpaceOnUse">
              <stop stop-color="#7c3aed"/>
              <stop offset="1" stop-color="#06b6d4"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <p class="loading-game-title" id="loading-title">Loading…</p>
      <div class="loading-bar-track" aria-hidden="true">
        <div class="loading-bar-fill" id="loading-bar"></div>
      </div>
      <p class="loading-hint">Tap anywhere to interact</p>
    </div>

    <!-- Error overlay (shown on iframe failure or bad game ID) -->
    <div class="game-error" id="game-error" hidden
         aria-live="assertive" role="alert">
      <span class="error-icon" aria-hidden="true">⚠️</span>
      <h2 class="error-heading">Couldn't load game</h2>
      <p  class="error-body" id="error-msg">
        The game prototype is unavailable right now.
      </p>
      <a href="index.html" class="error-back-btn" id="error-back">
        ← Back to Hub
      </a>
    </div>

    <!--
      THE GAME IFRAME
      ═══════════════
      • src set by game.js after reading ?id= param
      • sandbox grants the minimum permissions a WebGL/HTML5 game needs:
          allow-scripts        → run game JS
          allow-same-origin    → access local storage / assets
          allow-forms          → score submission forms
          allow-pointer-lock   → FPS-style games
          allow-popups         → optional share dialogs
      • allow attribute unlocks browser APIs the game may request
    -->
    <iframe
      id="game-frame"
      class="game-iframe"
      title="Game viewport"
      src="about:blank"
      allowfullscreen
      allow="autoplay; fullscreen; gamepad; vibrate; accelerometer; gyroscope"
      sandbox="allow-scripts allow-same-origin allow-forms
               allow-pointer-lock allow-popups
               allow-popups-to-escape-sandbox"
    ></iframe>

  </div><!-- /game-stage -->

  <script src="game.js"></script>
</body>
</html>
