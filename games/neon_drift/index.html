<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Drift</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas" width="400" height="600"></canvas>
    
    <!-- Start Screen Overlay -->
    <div id="start-screen" class="overlay">
      <h1 class="neon-text-blue">NEON DRIFT</h1>
      <p class="subtitle">Endless Cyberpunk Runner</p>
      <div class="instructions">
        <p>Use [A]/[D] or [←]/[→] to switch lanes</p>
        <p>Or swipe / drag mouse left/right</p>
        <p>Collect yellow diamonds for boosts & multiplier</p>
        <p>Avoid pink spikes</p>
      </div>
      <button id="start-btn" class="neon-btn">START DRIFT</button>
    </div>
    
    <!-- Game Over Screen Overlay -->
    <div id="game-over-screen" class="overlay" style="display: none;">
      <h1 class="neon-text-pink">CRASH DETECTED</h1>
      <p>Final Score: <span id="final-score" class="highlight">0</span></p>
      
      <!-- Leaderboard submission -->
      <div id="leaderboard-input-area" style="display: none;">
        <p>New High Score!</p>
        <input type="text" id="player-name-input" maxlength="3" placeholder="AAA" autofocus>
        <button id="submit-score-btn" class="neon-btn small">SUBMIT</button>
      </div>
      
      <!-- Leaderboard display -->
      <div id="leaderboard-container">
        <h3>LEADERBOARD</h3>
        <ul id="leaderboard-list">
          <!-- Populated by JS -->
        </ul>
      </div>
      
      <button id="restart-btn" class="neon-btn">RESTART [R]</button>
    </div>
  </div>

  <script src="collision.js"></script>
  <script src="leaderboard.js"></script>
  <script src="game.js"></script>
  <script>
    window.onload = () => {
      new Game('gameCanvas');
    };
  </script>
</body>
</html>
