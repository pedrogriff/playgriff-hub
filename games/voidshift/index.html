<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0,
        maximum-scale=1.0, user-scalable=no" />
  <title>Game Prototype â€” playgriff.io</title>
  <style>
    /* â”€â”€ Minimal reset â”€â”€ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #080910;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #f1f2f7;
      -webkit-font-smoothing: antialiased;
    }

    canvas {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      display: block;
    }

    .overlay {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 16px;
      pointer-events: none;
      text-align: center;
      padding: 24px;
    }

    .game-logo {
      font-size: clamp(2rem, 8vw, 3.5rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #7c3aed, #06b6d4);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-8px); }
    }

    .subtitle {
      font-size: clamp(0.75rem, 3vw, 0.9rem);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(136, 146, 164, 0.8);
    }

    .tap-hint {
      margin-top: 32px;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.35);
      animation: blink 2s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 0.35; }
      50%       { opacity: 0.9; }
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="overlay">
    <div class="game-logo" id="game-name">Prototype</div>
    <div class="subtitle">playgriff.io Â· WebGL Demo</div>
    <div class="tap-hint">Tap to play</div>
  </div>

  <script>
    /* â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
       Animated star-field / particle canvas.
       Runs inside the iframe as a stand-in game.
       Replace this file with your actual game build.
       â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */

    /* Receive game title from parent if possible */
    try {
      const params = new URLSearchParams(window.location.search);
      const title  = params.get('title');
      if (title) document.getElementById('game-name').textContent = 'VoidShift';
    } catch (_) {}

    const canvas = document.getElementById('c');
    const ctx    = canvas.getContext('2d');

    const COLORS = ['#7c3aed', '#06b6d4', '#a3e635', '#ec4899', '#f59e0b'];
    let   W, H, stars = [], raf;

    function resize() {
      W = canvas.width  = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }

    function makeStar() {
      return {
        x:     Math.random() * W,
        y:     Math.random() * H,
        r:     Math.random() * 1.8 + 0.3,
        vx:    (Math.random() - 0.5) * 0.3,
        vy:    Math.random() * 0.6 + 0.2,
        alpha: Math.random() * 0.6 + 0.2,
        color: COLORS[Math.floor(Math.random() * COLORS.length)],
        pulse: Math.random() * Math.PI * 2,
      };
    }

    function init() {
      stars = [];
      for (let i = 0; i < 120; i++) stars.push(makeStar());
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);

      /* Dark gradient background */
      const bg = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W,H)*0.7);
      bg.addColorStop(0, '#10111e');
      bg.addColorStop(1, '#080910');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);

      const t = performance.now() / 1000;

      stars.forEach(s => {
        s.x += s.vx;
        s.y += s.vy;
        s.pulse += 0.04;

        if (s.y > H + 4) Object.assign(s, makeStar(), { y: -4 });
        if (s.x < -4)    Object.assign(s, makeStar(), { x: W + 4 });
        if (s.x > W + 4) Object.assign(s, makeStar(), { x: -4 });

        const pulsedAlpha = s.alpha * (0.7 + 0.3 * Math.sin(s.pulse));
        const grd = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r * 4);
        grd.addColorStop(0, s.color + 'ff');
        grd.addColorStop(1, s.color + '00');
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r * 1.5, 0, Math.PI * 2);
        ctx.globalAlpha = pulsedAlpha;
        ctx.fillStyle   = grd;
        ctx.fill();
      });

      ctx.globalAlpha = 1;
      raf = requestAnimationFrame(draw);
    }

    resize();
    init();
    draw();

    window.addEventListener('resize', () => { resize(); }, { passive: true });
  </script>
</body>
</html>
