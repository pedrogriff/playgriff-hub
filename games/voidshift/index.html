<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoidShift</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <header>
            <h1>VoidShift</h1>
            <div id="level-info">
                <span id="level-name">Level 1</span>
                <span id="move-counter">Moves: 0</span>
            </div>
        </header>

        <main>
            <canvas id="game-canvas"></canvas>
        </main>

        <footer>
            <div class="controls">
                <button id="btn-undo" title="Undo (Ctrl+Z)">Undo</button>
                <button id="btn-redo" title="Redo (Ctrl+Y)">Redo</button>
                <button id="btn-reset" title="Reset Level (R)">Reset</button>
            </div>
            <div class="level-select-container">
                <label for="level-select">Select Level:</label>
                <select id="level-select">
                    <!-- Levels will be populated by JS -->
                </select>
            </div>
        </footer>
    </div>
    <script src="game.js" type="module"></script>
</body>
</html>
